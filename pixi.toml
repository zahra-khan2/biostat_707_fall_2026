[workspace]
name = "biostat707-checkpoint1"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
quarto = ">=1.7"
r-base = "4.5.*"
r-knitr = "*"
r-rmarkdown = "*"
"r-data.table" = "*"
r-dplyr = "*"
r-tidyr = "*"
r-ggplot2 = "*"
r-gtsummary = "*"
r-naniar = "*"
r-visdat = "*"
r-upsetr = "*"
r-sessioninfo = "*"
r-here = "*"
r-readr = "*"
python = "3.12.*"
pandas = "*"
r-tidyverse = ">=2.0.0,<3"
r-flextable = ">=0.10.1,<0.11"
r-gt = ">=1.3.0,<2"

[tasks]
checkpoint1 = "quarto render checkpoint1.qmd --output-dir output"
